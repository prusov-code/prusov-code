name: generate-snake

on:
  schedule:
    - cron: "0 */8 * * *"   # каждые 8 часов
  workflow_dispatch:        # можно запустить вручную

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   
      pages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # ← обновлено до v4

      - name: Generate snake animation
        uses: Platane/snk@v3         # ← основная версия, а не svg-only
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-purple.gif?color_snake=#AA6FF9&color_dots=#161b21,#4a2b5e,#6b3e8a,#8c52b6,#ad6ed9&color_background=#0d1117
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0   # обновлённая версия
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
